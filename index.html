<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acervo de Revistas de Modelismo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header class="topo">
  <!-- Troque por seu logo quadrado: coloque logo.png na mesma pasta -->
  <div class="logo"><img src="logo.png" alt="Logo" onerror="this.replaceWith(Object.assign(document.createElement('span'),{innerHTML:'<svg viewBox=&quot;0 0 24 24&quot;><path d=&quot;M2 14l9-9 3 3-9 9zM14 8l8 3-3 3zM3 21h18&quot;/></svg>'}))"></div>
  <h1>Acervo de Modelismo</h1>
  <button class="btn-menu" id="abrirMenu" aria-expanded="false" aria-controls="menu">Filtros</button>
  <div class="busca"><input id="busca" type="search" placeholder="Buscar por título ou edição" aria-label="Buscar"></div>
</header>

<aside class="menu" id="menu" aria-label="Filtros do catálogo">
  <details open><summary>Categorias</summary><div class="opcoes" id="f-categoria"></div></details>
  <details open><summary>Ano de publicação</summary><div class="opcoes" id="f-ano"></div></details>
  <details><summary>Título</summary><div class="opcoes" id="f-titulo"></div></details>
  <button class="limpar" id="limpar">Limpar filtros</button>
</aside>
<div class="fundo" id="fundo"></div>

<main>
  <p class="resumo" id="resumo" aria-live="polite"></p>
  <div class="grade" id="grade"></div>
  <p class="vazio" id="vazio" hidden>Nenhuma revista encontrada. Limpe os filtros ou mude a busca.</p>
  <p class="erro" id="erro" hidden></p>
  <div id="sentinela"></div>
</main>

<script src="app.js"></script>
<script>
const LOTE=12;
let todas=[],visiveis=[],mostradas=0;
const filtros={categoria:"",ano:"",titulo:"",q:""};
const $=s=>document.querySelector(s);

function contar(lista,campo){
  const m=new Map();
  lista.forEach(r=>{if(r[campo])m.set(r[campo],(m.get(r[campo])||0)+1)});
  return [...m.entries()];
}
function montarFiltro(id,campo,ordem){
  const caixa=$("#"+id);
  const itens=contar(todas,campo).sort(ordem);
  caixa.innerHTML=[["",todas.length,"Todas"],...itens.map(([v,n])=>[v,n,v])].map(([v,n,rot])=>
    `<button class="opcao" data-campo="${campo}" data-valor="${esc(v)}" aria-pressed="${filtros[campo]===v}">${esc(rot)}<span>${n}</span></button>`).join("");
}
function montarMenu(){
  montarFiltro("f-categoria","categoria",(a,b)=>a[0].localeCompare(b[0],"pt-BR"));
  montarFiltro("f-ano","ano",(a,b)=>b[0].localeCompare(a[0]));
  montarFiltro("f-titulo","titulo",(a,b)=>a[0].localeCompare(b[0],"pt-BR"));
}
function aplicar(){
  const q=filtros.q.toLowerCase();
  visiveis=todas.filter(r=>
    (!filtros.categoria||r.categoria===filtros.categoria)&&
    (!filtros.ano||r.ano===filtros.ano)&&
    (!filtros.titulo||r.titulo===filtros.titulo)&&
    (!q||(r.titulo+" "+r.edicao).toLowerCase().includes(q)))
    .sort((a,b)=>(b.data_postagem||"").localeCompare(a.data_postagem||""));
  mostradas=0;
  $("#grade").innerHTML="";
  $("#vazio").hidden=visiveis.length>0;
  $("#resumo").textContent=visiveis.length+(visiveis.length===1?" revista":" revistas")+" · mais recentes primeiro";
  montarMenu();
  maisCards();
}
function card(r){
  const capa=urlValida(r.capa_url)
    ?`<iframe src="${esc(r.capa_url)}" title="Capa de ${esc(r.titulo)} ${esc(r.edicao)}" loading="lazy" tabindex="-1" sandbox=""></iframe>`
    :`<div class="sem-capa">${esc(r.titulo)}<br>${esc(r.edicao)}</div>`;
  return `<a class="card" href="leitor.html?id=${encodeURIComponent(r.id)}" target="_blank" rel="noopener">
    <div class="capa">${capa}</div>
    <div class="carimbo"><h2>${esc(r.titulo)}</h2><p>${esc(r.categoria)} · ${esc(r.edicao)}</p><p>${esc(r.ano)}</p></div></a>`;
}
function maisCards(){
  if(mostradas>=visiveis.length)return;
  const lote=visiveis.slice(mostradas,mostradas+LOTE);
  $("#grade").insertAdjacentHTML("beforeend",lote.map(card).join(""));
  mostradas+=lote.length;
}
const obs=new IntersectionObserver(es=>{if(es[0].isIntersecting)maisCards()},{rootMargin:"400px"});
obs.observe($("#sentinela"));

document.addEventListener("click",e=>{
  const o=e.target.closest(".opcao");
  if(o){filtros[o.dataset.campo]=o.dataset.valor;aplicar();document.body.classList.remove("menu-aberto");return}
});
$("#limpar").onclick=()=>{Object.assign(filtros,{categoria:"",ano:"",titulo:"",q:""});$("#busca").value="";aplicar()};
$("#busca").addEventListener("input",e=>{filtros.q=e.target.value.trim();aplicar()});
const alternar=()=>{const a=document.body.classList.toggle("menu-aberto");$("#abrirMenu").setAttribute("aria-expanded",a)};
$("#abrirMenu").onclick=alternar;$("#fundo").onclick=alternar;

carregarCatalogo().then(d=>{todas=d;aplicar()}).catch(err=>{
  const e=$("#erro");e.hidden=false;
  e.textContent=err.message+". Se abriu o arquivo direto do computador, publique no GitHub Pages ou rode um servidor local, pois o navegador bloqueia a leitura do CSV em file://.";
});
</script>
</body>
</html>
